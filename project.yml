# XcodeGen project specification.
#
# Why this exists: we develop on Windows without Xcode. XcodeGen reads this YAML
# at CI time and emits `FitnessApp.xcodeproj` on the macOS runner — we never
# commit an .xcodeproj. Editing project settings = editing this file.
#
# Codemagic runs `brew install xcodegen` then `xcodegen generate`, then
# `xcodebuild` builds the resulting project.
#
# Docs: https://github.com/yonaskolb/XcodeGen/blob/master/Docs/ProjectSpec.md

name: FitnessApp

options:
  bundleIdPrefix: com.atamya
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en
  createIntermediateGroups: true
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: '5.9'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    # Empty DEVELOPMENT_TEAM means simulator-only builds. Once an Apple Developer
    # account exists, this gets injected via Codemagic env-vars and the iOS-device
    # archive build path lights up.
    DEVELOPMENT_TEAM: ''
    CODE_SIGN_STYLE: Automatic
    # DEL-121: Xcode 26.4.1 erweiterte den Default-Build-Pfad um einen
    # GenerateStringSymbols-Schritt, der aus Localizable.xcstrings automatisch
    # eine Swift-Compile-Time-Symbol-Datei generiert (typsichere String-API
    # à la `String.LocalizationValue.foo`). Der Schritt scheitert auf unserem
    # Catalog, wahrscheinlich wegen Apple-Format-Pattern-Keys wie
    # "%lld Rekorde" (Pre-DEL-117-Plural-Konvention) oder anderer Edge-Cases,
    # die der Symbol-Generator nicht sauber zu Swift-Identifiern konvertieren
    # kann. Wir nutzen die generierten Symbole nirgends — alle Catalog-Keys
    # werden per String-Literal referenziert (`Text("foo.bar", bundle: .module)`)
    # — daher kann der Schritt komplett deaktiviert werden, ohne dass
    # Functionality verloren geht. Bricht uns den Codemagic-Build raus.
    STRING_CATALOG_GENERATE_SYMBOLS: NO

# Local Swift Package at the repo root — same package the rest of the conversation
# already lives in. Each target below references products from this package.
packages:
  FitnessApp:
    path: .

targets:
  # ─────────────────────────────────────────────────────────────────────────
  # Main App
  # ─────────────────────────────────────────────────────────────────────────
  FitnessApp:
    type: application
    platform: iOS
    sources:
      - App/FitnessApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atamya.FitnessApp
        TARGETED_DEVICE_FAMILY: '1,2'      # iPhone + iPad
        INFOPLIST_FILE: App/FitnessApp/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FitnessApp/FitnessApp.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: FitnessApp
        product: FitnessAppCore
      - package: FitnessApp
        product: FitnessAppData
      - package: FitnessApp
        product: FitnessAppHealth
      - package: FitnessApp
        product: FitnessAppActivities
      - package: FitnessApp
        product: FitnessAppUI
      - target: FitnessAppWidgets
        embed: true                        # bundles the widget into the app

  # ─────────────────────────────────────────────────────────────────────────
  # Widget Extension (Live Activity)
  # ─────────────────────────────────────────────────────────────────────────
  FitnessAppWidgets:
    type: app-extension
    platform: iOS
    sources:
      - App/FitnessAppWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atamya.FitnessApp.widgets
        INFOPLIST_FILE: App/FitnessAppWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/FitnessAppWidgets/FitnessAppWidgets.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: FitnessApp
        product: FitnessAppActivities
      # DEL-216: Wasser-Widget liest/schreibt den App-Group-SwiftData-Store
      # (FitnessAppData) und rechnet das Tagesziel (FitnessAppCore).
      - package: FitnessApp
        product: FitnessAppCore
      - package: FitnessApp
        product: FitnessAppData
