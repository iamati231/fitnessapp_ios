# Codemagic CI/CD configuration.
#
# Two workflows:
#   1. swift-package — runs `swift build` + `swift test` + iOS-Simulator builds
#      of every library product. Catches cross-platform regressions early.
#   2. ios-app — generates the Xcode project from `project.yml` via XcodeGen,
#      then builds the iOS app + widget extension for the iOS Simulator. No
#      code signing here (we don't have an Apple Developer team yet); when a
#      team is registered, a third `testflight` workflow will archive + upload.

workflows:
  # ─────────────────────────────────────────────────────────────────────────
  # 1) Swift Package CI — runs on every push/PR
  # ─────────────────────────────────────────────────────────────────────────
  swift-package:
    name: Swift Package CI
    instance_type: mac_mini_m2
    max_build_duration: 30

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    environment:
      xcode: latest

    scripts:
      - name: Show toolchain
        script: |
          set -e
          swift --version
          xcodebuild -version

      - name: Resolve dependencies
        script: |
          set -e
          swift package resolve

      - name: Build (debug)
        script: |
          set -e
          swift build

      - name: Run unit tests
        script: |
          set -e
          swift test --parallel

      - name: Build library products for iOS Simulator
        # Stellt sicher, dass FitnessAppData / FitnessAppHealth / FitnessAppActivities
        # / FitnessAppUI auch fuer iOS-Targets sauber kompilieren — nicht nur fuer
        # den nativen macOS-Build, der `swift build` standardmaessig benutzt.
        script: |
          set -e
          for scheme in FitnessAppCore FitnessAppData FitnessAppHealth FitnessAppActivities FitnessAppUI; do
            echo "── Building $scheme for iOS Simulator ──"
            xcodebuild \
              -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -configuration Debug \
              build
          done

    artifacts:
      - .build/**/*.xctest

    publishing:
      email:
        recipients:
          - a.isik@atamya.com
        notify:
          success: false
          failure: true

  # ─────────────────────────────────────────────────────────────────────────
  # 2) iOS App build — generates the .xcodeproj via XcodeGen, then builds
  #    the app + widget extension for iOS Simulator. No signing.
  # ─────────────────────────────────────────────────────────────────────────
  ios-app:
    name: iOS App Build
    instance_type: mac_mini_m2
    max_build_duration: 30

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true
          source: true

    environment:
      xcode: latest

    scripts:
      - name: Install XcodeGen
        # Pre-installed on Codemagic m2 runners but `brew upgrade` keeps us on the
        # latest stable so newer SwiftUI / WidgetKit features generate correctly.
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: Generate Xcode project
        script: |
          set -e
          xcodegen generate
          ls -la FitnessApp.xcodeproj

      - name: Resolve Swift Package dependencies
        # SPM resolution against the local package referenced from project.yml.
        script: |
          set -e
          xcodebuild \
            -resolvePackageDependencies \
            -project FitnessApp.xcodeproj \
            -scheme FitnessApp

      - name: Build app + widget for iOS Simulator
        # No code signing for simulator builds — CODE_SIGNING_ALLOWED=NO covers both
        # the app target and embedded extensions. Validates that the entire app
        # compiles, links, and embeds the widget cleanly.
        script: |
          set -e
          xcodebuild \
            -project FitnessApp.xcodeproj \
            -scheme FitnessApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app

    publishing:
      email:
        recipients:
          - a.isik@atamya.com
        notify:
          success: true
          failure: true

  # ─────────────────────────────────────────────────────────────────────────
  # 3) TestFlight Release — code-signs + uploads to App Store Connect
  #
  # Triggers ONLY on git tags matching `v*` (e.g. `v0.1.0`, `v0.2.0-beta.1`).
  # We deliberately don't auto-publish on every push — TestFlight has rate
  # limits and cluttered build numbers slow the review process.
  #
  # PRE-FLIGHT (one-time, after Apple Developer Program is active):
  #   1. App Store Connect → My Apps → "+" → New App.
  #      - Bundle ID: com.atamya.FitnessApp
  #      - SKU: fitnessapp-ios (any unique string)
  #      - Primary language: English
  #
  #   2. App Store Connect → Users and Access → Integrations → App Store
  #      Connect API → "+" → Generate API Key.
  #      - Access: "App Manager" (sufficient for TestFlight uploads)
  #      - Download the .p8 file IMMEDIATELY (you can't re-download later)
  #      - Note the Issuer ID (top of page) and Key ID (next to the key)
  #
  #   3. Codemagic UI → Teams → Personal Account → Integrations → App Store
  #      Connect → Add new key:
  #      - Name: atamya-asc-key
  #      - Issuer ID: <from step 2>
  #      - Key ID: <from step 2>
  #      - API key: paste contents of the .p8 file
  #
  #   4. In the workflow's "App Store Connect" section below, the
  #      `app_store_connect:` block references that key by name. Codemagic
  #      automatically creates / renews the signing certs + provisioning
  #      profiles via the API key — no manual cert juggling required.
  #
  # See `TestFlightSetup.md` in the repo root for screenshots + detailed
  # walkthrough.
  # ─────────────────────────────────────────────────────────────────────────
  testflight:
    name: TestFlight Release
    instance_type: mac_mini_m2
    max_build_duration: 60

    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true

    # The `integrations.app_store_connect` reference binds the workflow to the
    # API key the user registered in Codemagic UI (Phase 3 of TestFlightSetup.md).
    # Without this, the `ios_signing` block below has no way to authenticate
    # with Apple and the build fails at sign-time with "No matching profiles
    # found". The string MUST match the key's display name in Codemagic
    # Teams → Integrations → App Store Connect.
    integrations:
      app_store_connect: atamya-asc-key

    environment:
      xcode: latest

      # Reads the App Store Connect API key registered in Codemagic-Teams →
      # Integrations. Three secrets defined in the Codemagic UI Environment
      # Variables, NOT here:
      #   - APP_STORE_CONNECT_KEY_IDENTIFIER  (the Key ID)
      #   - APP_STORE_CONNECT_ISSUER_ID
      #   - APP_STORE_CONNECT_PRIVATE_KEY    (the .p8 file content)
      groups:
        - app_store_credentials   # define this group in Codemagic UI

      vars:
        XCODE_PROJECT: 'FitnessApp.xcodeproj'
        XCODE_SCHEME: 'FitnessApp'
        # App Store Connect "Apple ID" of the Deltiq app record. Used by the
        # `app-store-connect get-latest-app-store-build-number` lookup so each
        # TestFlight upload gets a monotonically-increasing build number.
        APP_STORE_APP_ID: '6768627358'
        # Bundle IDs for main app + widget extension. Each needs its own
        # provisioning profile fetched/created explicitly below.
        BUNDLE_ID: 'com.atamya.FitnessApp'
        WIDGET_BUNDLE_ID: 'com.atamya.FitnessApp.widgets'

    scripts:
      # DEL-217: Toolchain protokollieren. `xcode: latest` oben ist nach drei
      # erlittenen Toolchain-Bruechen (DEL-121 String-Catalog-Symbole,
      # Xcode-26.4-Strictness) ein bewusstes Risiko: Apple kann die Version
      # zwischen zwei Releases wechseln, ohne dass sich hier eine Zeile
      # aendert. Bewusst NICHT auf eine geratene Nummer gepinnt — ein nicht
      # existierender Versionsstring laesst alle drei Workflows sofort in der
      # Environment-Phase scheitern. Vorgehen zum Pinnen: die hier geloggte
      # Version ablesen, in der Codemagic-UI gegen die Liste verfuegbarer
      # Versionen pruefen, dann `xcode: latest` an allen drei Stellen
      # ersetzen.
      - name: Show toolchain
        script: |
          set -e
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        script: |
          set -e
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi

      # DEL-217: Test-Gate. Vorher lief `swift test` NUR im swift-package-
      # Workflow (auf push/pull_request) — ein v*-Tag konnte also einen roten
      # Commit direkt an TestFlight ausliefern. Steht absichtlich VOR dem
      # Signing und dem Archive: faellt hier etwas um, hat der Build noch
      # keine Zertifikate angefasst und keine Build-Nummer verbraucht.
      - name: Run unit tests (Release-Gate)
        script: |
          set -e
          swift test --parallel

      - name: Determine build number from App Store Connect
        # Bumps CURRENT_PROJECT_VERSION in project.yml BEFORE XcodeGen
        # generates the .xcodeproj, so XcodeGen bakes the new build number
        # into the Xcode project's build settings.
        #
        # Use `get-latest-build-number` (not `get-latest-app-store-build-number`):
        # the App-Store-variant only counts RELEASED App-Store versions,
        # ignoring TestFlight-only builds. While we're pre-release (v0.1.0
        # is in TestFlight, not released), the App-Store-variant returned 0
        # and the computed NEXT collided with the TestFlight build's own
        # number (v0.1.10/11 both tried "1"). `get-latest-build-number`
        # covers TestFlight + App Store builds.
        #
        # Why not `agvtool new-version -all`: when Info.plist references
        # `$(CURRENT_PROJECT_VERSION)` AND the project was just regenerated
        # by XcodeGen, agvtool's in-place .pbxproj rewrite is unreliable.
        # The sed-on-project.yml approach is dumb but bulletproof: bump
        # the single source of truth, let XcodeGen propagate.
        script: |
          set -e
          NEXT=$(($(app-store-connect get-latest-build-number "$APP_STORE_APP_ID") + 1))
          echo "Using build number: $NEXT"
          # Match `CURRENT_PROJECT_VERSION: '<digits>'` regardless of current value.
          # macOS sed needs '' after -i for in-place edit without backup.
          sed -i '' "s/CURRENT_PROJECT_VERSION: '[0-9]*'/CURRENT_PROJECT_VERSION: '$NEXT'/" project.yml
          grep CURRENT_PROJECT_VERSION project.yml

      # DEL-217: Der frueher hier stehende Schritt "Generate placeholder app
      # icon" ist ENTFERNT. Er hat bei JEDEM Release das committete
      # App/FitnessApp/Assets.xcassets/AppIcon.appiconset/icon-1024.png mit
      # einem ImageMagick-Radial-Gradienten ueberschrieben. Seit dem echten
      # Icon-Commit (19 PNGs, 1024er mit ~997 KB) hat damit jeder
      # TestFlight-Build einen Farbverlauf-Platzhalter ausgeliefert statt des
      # echten Icons. Der Schritt-Kommentar verlangte selbst, ihn nach dem
      # ersten echten Icon zu loeschen — das war ueberfaellig.
      # Icons bitte ausschliesslich im Asset-Catalog pflegen.

      - name: Set marketing version from git tag
        # DEL-217: MARKETING_VERSION lag hart auf '0.1.0' in project.yml,
        # waehrend nur CURRENT_PROJECT_VERSION (die Build-Nummer) gebumpt
        # wurde — in App Store Connect hiessen deshalb ALLE Beta-Builds
        # "0.1.0 (n)". Die Version kommt jetzt aus dem Tag, der den Build
        # ausgeloest hat: "v0.1.73-water-widget" -> "0.1.73".
        #
        # Muss VOR `xcodegen generate` laufen, weil XcodeGen den Wert aus
        # project.yml in die .pbxproj-Build-Settings backt. Gleiche
        # sed-auf-project.yml-Strategie wie beim Build-Number-Step oben,
        # aus demselben Grund (agvtool ist auf frisch generierten Projekten
        # unzuverlaessig).
        #
        # Kein Abbruch, wenn der Tag kein Semver-Praefix hat — dann bleibt
        # der Wert aus project.yml stehen und der Build laeuft weiter.
        script: |
          set -e
          VERSION=$(printf '%s' "${CM_TAG:-}" | sed -E 's/^v//' | grep -oE '^[0-9]+\.[0-9]+(\.[0-9]+)?' || true)
          if [ -n "$VERSION" ]; then
            sed -i '' "s/MARKETING_VERSION: '[^']*'/MARKETING_VERSION: '$VERSION'/" project.yml
            echo "Marketing version from tag '${CM_TAG}': $VERSION"
          else
            echo "WARNUNG: aus Tag '${CM_TAG:-<leer>}' liess sich keine Version ableiten — behalte den Wert aus project.yml"
          fi
          grep MARKETING_VERSION project.yml

      - name: Generate Xcode project
        script: |
          set -e
          xcodegen generate

      - name: Set up code signing
        # Persistent-key approach (v0.1.10+) — solves the Apple 2-certs-per-
        # team-per-type cap by reusing ONE Distribution cert across all builds.
        #
        # The private key lives as a secure env var APP_STORE_CONNECT_CERTIFICATE_KEY
        # in the Codemagic `app_store_credentials` group. It was generated
        # once locally (ssh-keygen -t rsa -b 2048 -m PEM) and pasted into the
        # Codemagic UI. The corresponding Distribution cert is created in
        # Apple's DB on the FIRST build that uses this key and then re-fetched
        # (not re-created) on every subsequent build.
        #
        # If we ever need to rotate the key (compromise, etc.):
        #   1. Revoke the existing Distribution cert in Developer Portal
        #   2. Generate a fresh PEM locally, update the Codemagic env var
        #   3. Next build creates a new cert tied to the new key
        #
        # Migration notes (v0.1.10 was the cutover from inline ssh-keygen):
        # before the first build with this yaml, ALL pre-existing Distribution
        # certs were revoked in Developer Portal to start clean.
        script: |
          set -e
          keychain initialize

          # Cert + provisioning profile for the main app. `--certificate-key`
          # with `@env:` syntax loads the PEM from the Codemagic env var; the
          # cert is auto-created on first run and re-fetched thereafter.
          app-store-connect fetch-signing-files \
            "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:APP_STORE_CONNECT_CERTIFICATE_KEY \
            --create

          # Same for the widget extension — reuses the SAME cert (Apple links
          # one cert to many provisioning profiles, the profiles differ by
          # bundle ID).
          app-store-connect fetch-signing-files \
            "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@env:APP_STORE_CONNECT_CERTIFICATE_KEY \
            --create

          # Cert + private key into the build keychain, then wire profiles
          # into Xcode build settings.
          keychain add-certificates
          xcode-project use-profiles

      - name: Resolve Swift Package dependencies
        script: |
          set -e
          xcodebuild \
            -resolvePackageDependencies \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME"

      - name: Build .ipa for App Store distribution
        # DEL-121: --archive-flags injiziert Build-Settings auf der xcodebuild-
        # Command-Line statt im Project-File. Wichtig fuer SwiftPM-Subtargets,
        # die nicht von XcodeGen's project.yml-Settings erfasst werden.
        #
        # STRING_CATALOG_GENERATE_SYMBOLS=NO:
        # Xcode 26.4.1 fuehrt einen neuen Build-Schritt ein, der aus
        # Localizable.xcstrings automatisch typsichere Swift-Compile-Time-
        # Symbole generiert. Der Generator scheitert auf unserem Catalog —
        # vermutlich an den Apple-Format-Pattern-Plural-Keys
        # ("%lld Rekorde", "%lld Übungen — %@" etc.), die valide Apple-
        # Plural-Konvention sind aber sich nicht in Swift-Identifier
        # konvertieren lassen. Wir nutzen die generierten Symbole nirgends
        # (alle Catalog-Lookups laufen ueber String-Literale), daher
        # gefahrlos deaktivierbar.
        script: |
          set -e
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-flags 'STRING_CATALOG_GENERATE_SYMBOLS=NO'

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM.zip

    publishing:
      app_store_connect:
        # Uses the API key registered in Codemagic-Teams → Integrations.
        # `submit_to_testflight: true` makes the build immediately available
        # to internal testers — no review step. External testers (public
        # link) require a separate manual approval per Apple.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        # Internal testers group — create in App Store Connect → TestFlight
        # → Internal Testing. Builds appear there automatically once uploaded.
        beta_groups:
          - 'Atamya Internal'

      email:
        recipients:
          - a.isik@atamya.com
        notify:
          success: true
          failure: true
