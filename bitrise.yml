format_version: '11'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

# Bitrise CI/CD — Deltiq iOS App
#
# Workflow "deploy": XcodeGen → Build → Sign → TestFlight
# Auto-increment: $BITRISE_BUILD_NUMBER (Bitrise erhöht bei jedem Build)
#
# Bitrise Integrations → App Store Connect → API key muss verbunden sein.
# Secret in Bitrise UI (Settings → Secret Environment Variables):
#   APP_STORE_CONNECT_CERTIFICATE_KEY  Signing-Key PEM (derselbe wie Codemagic)

app:
  envs:
    - BITRISE_PROJECT_PATH: Deltiq.xcodeproj
    - BITRISE_SCHEME: Deltiq
    - BUNDLE_ID: com.deltiq.Deltiq
    - WIDGET_BUNDLE_ID: com.deltiq.Deltiq.widgets

workflows:
  deploy:
    meta:
      bitrise.io:
        stack: osx-xcode-27.2.x
        machine_type_id: g2-m1.8core
    steps:
      - activate-ssh-key@4: {}

      - git-clone@8: {}

      - script@1:
          title: Install XcodeGen
          inputs:
            - content: |
                set -e
                if ! command -v xcodegen >/dev/null 2>&1; then
                  brew install xcodegen
                fi
                xcodegen --version

      - script@1:
          title: Set build number + marketing version
          inputs:
            - content: |
                set -e
                # Build number: Bitrise auto-increments BITRISE_BUILD_NUMBER
                sed -i '' "s/CURRENT_PROJECT_VERSION: '[0-9]*'/CURRENT_PROJECT_VERSION: '$BITRISE_BUILD_NUMBER'/" project.yml
                echo "Build number: $BITRISE_BUILD_NUMBER"

                # Marketing version: aus Tag ableiten (z.B. v0.1.76 → 0.1.76)
                VERSION=$(printf '%s' "${BITRISE_GIT_TAG:-}" | sed -E 's/^v//' | grep -oE '^[0-9]+\.[0-9]+(\.[0-9]+)?' || true)
                if [ -n "$VERSION" ]; then
                  sed -i '' "s/MARKETING_VERSION: '[^']*'/MARKETING_VERSION: '$VERSION'/" project.yml
                  echo "Marketing version: $VERSION"
                fi
                grep -E "CURRENT_PROJECT_VERSION|MARKETING_VERSION" project.yml

      - script@1:
          title: Generate Xcode project
          inputs:
            - content: |
                set -e
                xcodegen generate
                ls -la Deltiq.xcodeproj

      - ios-auto-provision-appstoreconnect@1:
          inputs:
            - connection: 'api-key'
            - certificate_url_list: $APP_STORE_CONNECT_CERTIFICATE_KEY
            - distribution_type: app-store
            - project_path: $BITRISE_PROJECT_PATH
            - scheme: $BITRISE_SCHEME

      - xcode-archive@5:
          inputs:
            - project_path: $BITRISE_PROJECT_PATH
            - scheme: $BITRISE_SCHEME
            - configuration: Release
            - export_method: app-store
            - xcconfig_content: "STRING_CATALOG_GENERATE_SYMBOLS = NO"

      - deploy-to-itunesconnect-deliver@2:
          inputs:
            - connection: 'api-key'
            - submit_for_review: 'no'
            - skip_screenshots: 'yes'
            - skip_app_version_update: 'yes'
            - is_remove_generated_dsyms: 'no'
